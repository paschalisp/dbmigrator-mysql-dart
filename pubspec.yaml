name: dbmigrator_mysql
description: MySQL/MariaDB database migration library with file-based, versioned schema management supporting both upgrades and downgrades.
version: 0.1.3
repository: https://github.com/paschalisp/dbmigrator-mysql-dart
homepage: https://github.com/paschalisp/dbmigrator-mysql-dart
topics:
  - database
  - migration
  - versioning
  - mysql
  - mariadb


environment:
  sdk: ">=3.10.0 <4.0.0"


dependencies:
  crypto: ^3.0.7
  dbmigrator: ^0.1.2
  mysql_dart: ^3.0.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
